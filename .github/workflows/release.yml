name: Release Builds

run-name: Release Builds · ${{ github.ref_name }} · ${{ github.actor }} · #${{ github.run_number }}

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Android release APK/AAB
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_STORE_PASSWORD: ${{ secrets.LOCLOGGER_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_ALIAS: ${{ secrets.LOCLOGGER_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_PASSWORD: ${{ secrets.LOCLOGGER_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Validate release signing secrets
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_STORE_PASSWORD ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_ALIAS ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty or not available to this workflow"
              exit 1
            fi
          done

      - name: Verify release signing keystore
        shell: bash
        run: |
          keytool -list -v \
            -keystore keystore/loclogger-release.keystore \
            -storepass "$ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_STORE_PASSWORD" \
            -alias "$ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_ALIAS" \
            | grep -E 'Alias name:|SHA256:'

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --build-cache --stacktrace
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          bundle="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$bundle"
          mv "$apk" "app/build/outputs/apk/release/LocLogger-${GITHUB_REF_NAME}.apk"
          mv "$bundle" "app/build/outputs/bundle/release/LocLogger-${GITHUB_REF_NAME}.aab"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: LocLogger-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/LocLogger-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: LocLogger-release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/LocLogger-${{ github.ref_name }}.aab
          if-no-files-found: error

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/LocLogger-${{ github.ref_name }}.apk
            app/build/outputs/bundle/release/LocLogger-${{ github.ref_name }}.aab
          generate_release_notes: true
