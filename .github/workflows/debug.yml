name: Beta Builds

run-name: Beta Builds · ${{ github.head_ref || github.ref_name }} · ${{ github.actor }} · #${{ github.run_number }}

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-beta:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_STORE_PASSWORD: ${{ secrets.LOCLOGGER_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_ALIAS: ${{ secrets.LOCLOGGER_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_PASSWORD: ${{ secrets.LOCLOGGER_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LocLogger-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: LocLogger-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/LocLogger-debug.apk
          if-no-files-found: error
