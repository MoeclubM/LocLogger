name: Beta Builds

run-name: Beta Builds · ${{ github.head_ref || github.ref_name }} · ${{ github.actor }} · #${{ github.run_number }}

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-beta:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_STORE_PASSWORD: ${{ secrets.LOCLOGGER_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_ALIAS: ${{ secrets.LOCLOGGER_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_PASSWORD: ${{ secrets.LOCLOGGER_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Build debug and optional release APKs
        shell: bash
        run: |
          chmod +x gradlew
          BUILD_TIME="$(date -u +%Y%m%d-%H%M%S)"
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 1.0.0)"
          VERSION="${VERSION#v}"

          rename_apks() {
            local build_type="$1"
            local out_dir="app/build/outputs/apk/${build_type}"
            if [ ! -d "$out_dir" ]; then
              return
            fi
            for apk in "$out_dir"/*.apk; do
              [ -e "$apk" ] || continue
              base="$(basename "$apk" .apk)"
              base="${base%-${build_type}}"
              abi="universal"
              case "$base" in
                *-arm64-v8a) abi="arm64-v8a" ;;
                *-armeabi-v7a) abi="armeabi-v7a" ;;
                *-x86_64) abi="x86_64" ;;
                *-universal) abi="universal" ;;
              esac
              mv "$apk" "${out_dir}/LocLogger-${VERSION}-${BUILD_TIME}-${build_type}-${abi}.apk"
            done
          }

          echo "Building debug APK (per-ABI + universal)"
          ./gradlew :app:assembleDebug -PversionName="$VERSION" --build-cache --stacktrace
          rename_apks debug

          if [ -n "$ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_STORE_PASSWORD" ] && \
             [ -n "$ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_ALIAS" ] && \
             [ -n "$ORG_GRADLE_PROJECT_LOCLOGGER_RELEASE_KEY_PASSWORD" ]; then
            echo "Release signing secrets present; building release APK too"
            ./gradlew :app:assembleRelease -PversionName="$VERSION" --build-cache --stacktrace
            rename_apks release
            echo "release_built=true" >> "$GITHUB_ENV"
          else
            echo "::warning::LOCLOGGER_RELEASE_* signing secrets missing; skipping release build"
            echo "release_built=false" >> "$GITHUB_ENV"
          fi

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: LocLogger-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        if: env.release_built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: LocLogger-release-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
